<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contato — Sabores do Nordeste</title>

    <!-- Fonte -->
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- CSS externo -->
    <link rel="stylesheet" href="contato.css" />
  </head>

  <body>
    <!-- ======= HEADER ======= -->
    <header class="header">
      <div class="wrap">
        <div class="brand">SABORES DO NORDESTE</div>
        <nav class="nav">
          <a href="index.html">🏠 Início</a>
          <a href="receitas.html">🍛 Receitas</a>
          <a href="tradicional.html">🌾 Tradicional</a>
          <a href="dicas.html">💡 Dicas</a>
          <a href="contato.html">✉️ Contato</a>
        </nav>
      </div>
    </header>

    <!-- ======= HERO ======= -->
    <section class="hero">
      <div class="inner">
        <h1 class="headline">✉️ Contato</h1>
        <p class="tagline">
          Envie sua mensagem — formulário funcional com Formspree.
        </p>
      </div>
    </section>

    <!-- ======= CONTEÚDO PRINCIPAL ======= -->
    <main class="container">
      <form action="https://formspree.io/f/mkgqqvrd" method="POST">
        <div class="form-row">
          <input
            class="input"
            type="text"
            name="nome"
            placeholder="Seu nome"
            required
          />
          <input
            class="input"
            type="email"
            name="email"
            placeholder="Seu email"
            required
          />
        </div>

        <div style="margin-bottom: 12px">
          <textarea
            class="input"
            name="mensagem"
            rows="6"
            placeholder="Sua mensagem"
            required
          ></textarea>
        </div>

        <div>
          <button class="btn" type="submit">Enviar mensagem</button>
        </div>

        <p class="small" style="margin-top: 8px">
          💌 Suas mensagens serão enviadas diretamente para o e-mail configurado
          no Formspree.
        </p>
      </form>
    </main>

    <!-- ======= FOOTER ======= -->
    <footer class="footer">
      © Sabores do Nordeste — Desenvolvido com carinho.
    </footer>
  </body>
</html>
