<!doctype html><html lang='pt-BR'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Contato — Sabores do Nordeste</title><link href='https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;700;800&display=swap' rel='stylesheet'><style>:root{--primary:#0b4f76;--accent:#ff7a18;--bg:#fff8f2}
*{box-sizing:border-box}body{font-family:Nunito,system-ui,-apple-system,Segoe UI,Roboto,Arial;margin:0;background:var(--bg);color:#123}
.header{background:linear-gradient(90deg,var(--primary),#0d6b8f);color:#fff;position:sticky;top:0;z-index:40}
.header .wrap{max-width:1100px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:800;letter-spacing:0.6px}
.nav a{color:rgba(255,255,255,0.95);text-decoration:none;margin-left:14px;font-weight:700}
.hero{background-image:url('imagens/bannertopo.jpg');background-size:cover;background-position:center;min-height:34vh;display:flex;align-items:center;justify-content:center;position:relative}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg, rgba(255,255,255,0.0), rgba(255,255,255,0.9) 60%)}
.hero .inner{position:relative;z-index:2;max-width:1100px;padding:36px 20px}
.headline{font-size:2.4rem;font-weight:800;color:var(--primary);margin:0 0 8px}
.tagline{color:#234;margin:0 0 12px}
.container{max-width:1100px;margin:0 auto;padding:28px 20px}
.cards{display:grid;grid-template-columns:repeat(1,1fr);gap:16px}
@media(min-width:700px){.cards{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1100px){.cards{grid-template-columns:repeat(3,1fr)}}
.card{background:linear-gradient(#fff,#fffaf6);border-radius:12px;overflow:hidden;box-shadow:0 10px 30px rgba(11,79,118,0.08);transition:transform .35s;cursor:pointer}
.card:hover{transform:translateY(-8px)}
.thumb{width:100%;height:200px;object-fit:cover;display:block}
.card-body{padding:12px}
.kicker{display:inline-block;background:var(--accent);color:#fff;padding:6px 10px;border-radius:999px;font-weight:800;font-size:0.85rem}
.footer{padding:28px 20px;text-align:center;color:#4b5563}
.list-links{list-style:none;padding:0;margin:0}
.list-links li{padding:10px 0;border-bottom:1px solid rgba(0,0,0,0.04)}
.form-row{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
@media(min-width:700px){.form-row{flex-direction:row}.form-row input,.form-row button{flex:1}}
.input,textarea{padding:10px;border:1px solid #e6e6e6;border-radius:8px;font-size:1rem;width:100%}
.btn{background:var(--primary);color:#fff;padding:10px 14px;border-radius:10px;border:none;cursor:pointer;font-weight:700}
.small{font-size:0.9rem;color:#445}
</style></head><body><header class="header">
  <div class="wrap">
    <div class="brand">SABORES DO NORDESTE</div>
    <nav class="nav">
      <a href="index.html">🏠 Início</a>
      <a href="receitas.html">🍛 Receitas</a>
      <a href="tradicional.html">🌾 Tradicional</a>
      <a href="dicas.html">💡 Dicas</a>
      <a href="contato.html">✉️ Contato</a>
    </nav>
  </div>
</header>
<section class='hero'><div class='inner'><h1 class='headline'>✉️ Contato</h1><p class='tagline'>Envie sua mensagem — formulário funcional com Formspree.</p></div></section><main class='container'><form action='https://formspree.io/f/mkgqqvrd' method='POST'><div class='form-row'><input class='input' type='text' name='nome' placeholder='Seu nome' required><input class='input' type='email' name='email' placeholder='Seu email' required></div><div style='margin-bottom:12px;'><textarea class='input' name='mensagem' rows='6' placeholder='Sua mensagem' required></textarea></div><div><button class='btn' type='submit'>Enviar mensagem</button></div><p class='small' style='margin-top:8px;'>💌 Suas mensagens serão enviadas diretamente para o e-mail configurado no Formspree.</p></form></main><footer class="footer">
  © Sabores do Nordeste — Desenvolvido com carinho.
</footer>
</body></html>
