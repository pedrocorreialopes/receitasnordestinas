<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contato</title>
  <style>
    body {
      font-family: Nunito, Arial, sans-serif;
      margin: 0;
      background: #fff8f2;
      color: #123;
      padding: 20px;
    }

    header {
      background: linear-gradient(90deg, #0b4f76, #0d6b8f);
      color: #fff;
      padding: 14px;
    }

    header .container {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header nav a {
      color: #fff;
      margin-left: 12px;
      text-decoration: none;
    }

    main {
      max-width: 1100px;
      margin: 20px auto;
    }

    h1 {
      margin-bottom: 20px;
    }

    form {
      display: flex;
      flex-direction: column;
    }

    .input {
      padding: 10px;
      margin-bottom: 10px;
      width: 100%;
      border-radius: 6px;
      border: 1px solid #ddd;
      font-size: 1rem;
    }

    button {
      background: #0b4f76;
      color: #fff;
      padding: 10px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 1rem;
    }

    button:hover {
      background: #0d6b8f;
    }
  </style>
</head>

<body>
  <header>
    <div class="container">
      <div style="font-weight: 800;">SABORES DO NORDESTE</div>
      <nav>
        <a href="index.html">🏠 Início</a>
      </nav>
    </div>
  </header>

  <main>
    <h1>✉️ Contato</h1>

    <form onsubmit="event.preventDefault(); alert('Mensagem pronta para envio (sem backend nesta versão).');">
      <input class="input" placeholder="Seu nome" required />
      <input class="input" placeholder="Seu email" type="email" required />
      <textarea class="input" placeholder="Sua mensagem" required style="height: 140px;"></textarea>
      <button>Enviar</button>
    </form>
  </main>
</body>
</html>
